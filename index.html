<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;500&display=swap">
<style>
/* Layout: one full-bleed canvas pretending to be a forgotten 1997 page; a single speech line docked at the bottom; two quiet controls top-right once the glass is gone. */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --ink-soft:#3b3b44;
  --void:#05040a;
  --whisper:#dce6ff;
  --dim:#7a7f9e;
  --line:rgba(220,230,255,.2);
  --pulse:#7af0ff;
  --mono:"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --old:"Times New Roman", Times, serif;
  color-scheme: light;
}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--old);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
body.void{background:var(--void);color:var(--whisper)}
body.noc,body.noc #c{cursor:none}
#c{position:fixed;inset:0;display:block;outline:none}
#c:focus-visible{box-shadow:inset 0 0 0 2px var(--pulse)}
#say{
  position:fixed;left:0;right:0;bottom:0;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;
}
#say p{
  margin:0;max-width:42ch;min-height:1.6em;text-align:center;text-wrap:balance;
  font:300 clamp(13px,2.4vw,17px)/1.6 var(--mono);letter-spacing:.02em;color:var(--ink-soft);
  transition:opacity .5s ease;
}
body.void #say p{color:var(--whisper);text-shadow:0 0 18px rgba(122,240,255,.35)}
#ui{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
}
#ui button{
  font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:2px;
  padding:9px 11px;cursor:pointer;transition:color .2s,border-color .2s;
}
#ui button:hover{color:var(--whisper);border-color:var(--dim)}
#ui button:focus-visible{outline:1px solid var(--pulse);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="Página em construção. Carrega em Enter para bater no vidro."></canvas>
<div id="say" aria-hidden="true"><p id="sayp"></p></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="ui" hidden>
  <button id="som" type="button" aria-pressed="true">Som: ligado</button>
  <button id="reset" type="button" hidden>Pôr o vidro de volta</button>
</div>
<noscript><p style="padding:24px">Página em construção.</p></noscript>

<script>
(()=>{
'use strict';
/* =================================================================
   basics
   ================================================================= */
const TAU=Math.PI*2,R=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k,pick=a=>a[(R()*a.length)|0];
const Q=new URLSearchParams(location.search);
const FAST=Q.has('fast')?.15:1,Tm=ms=>ms*FAST;
const FAKE_SX=Q.has('sx')?+Q.get('sx'):null,FAKE_SY=Q.has('sy')?+Q.get('sy'):null;
const wall=()=>Date.now(),perf=()=>performance.now();
const p2=n=>String(n).padStart(2,'0');
const MONO='"Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const sayEl=document.getElementById('sayp'),live=document.getElementById('live');
const ui=document.getElementById('ui'),btnSom=document.getElementById('som'),btnReset=document.getElementById('reset');
const body=document.body,root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse=matchMedia('(pointer: coarse)').matches;

let W=0,H=0,dpr=1;
let stage='A';            // A: the page · C: the void · D: falling into the eye · M: what it saw · X: behind the glass
let clicks=0,pending=false;
let impacts=[],shards=[],ripples=[],dust=[],glyphs=[],zees=[],bursts=[];
let shake=0,flash=0,avatarOn=false,pleaOverride=null,typed='',typeTimer=null,awaitingName=false;
let timers=[];
const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id;};

/* =================================================================
   memory between visits
   ================================================================= */
const KEY='gocrazy.vidro.v2';
const store={
  get(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}},
  set(patch){try{const s=Object.assign(this.get(),patch);localStorage.setItem(KEY,JSON.stringify(s));return s;}catch(e){return null;}},
  add(k,v){const s=this.get();this.set({[k]:(s[k]||0)+v});}
};
const atLoad=store.get();
const returning=(atLoad.births||0)>0;

/* =================================================================
   where this window is on the screen
   ================================================================= */
const orig={x:0,y:0,cal:false,cx:0,cy:0};
function scr(){return {x:FAKE_SX??(window.screenX??window.screenLeft??0),y:FAKE_SY??(window.screenY??window.screenTop??0)};}
function updOrigin(){
  const s=scr();
  if(FAKE_SX!==null){orig.x=s.x;orig.y=s.y;return;}
  if(orig.cal){orig.x=s.x+orig.cx;orig.y=s.y+orig.cy;}
  else{orig.x=s.x+Math.max(0,(outerWidth-innerWidth)/2);orig.y=s.y+Math.max(0,outerHeight-innerHeight);}
}
function calibrate(e){
  if(FAKE_SX!==null||typeof e.screenX!=='number')return;
  const s=scr();orig.cx=(e.screenX-e.clientX)-s.x;orig.cy=(e.screenY-e.clientY)-s.y;orig.cal=true;updOrigin();
}
const myRect=()=>({x:orig.x,y:orig.y,w:W,h:H});
const inRect=(x,y,r,m=0)=>x>=r.x+m&&x<=r.x+r.w-m&&y>=r.y+m&&y<=r.y+r.h-m;

const ptr={x:0,y:0,has:false,lastPerf:0,speed:0,down:false};        // this window, client px
const gp={sx:0,sy:0,has:false,last:0,speed:0,down:false,src:''};    // newest pointer anywhere, screen px

/* =================================================================
   the creature's body (also used for you, later, and for the giant)
   ================================================================= */
function ribbon(g,P,ox,oy,k,col){
  const n=P.length,L=new Array(n),Rr=new Array(n);
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const w=(.6+(1-i/n)*8)*k,nx=-dy/d*w,ny=dx/d*w,x=P[i].x-ox,y=P[i].y-oy;
    L[i]=[x+nx,y+ny];Rr[i]=[x-nx,y-ny];
  }
  g.fillStyle=col;g.beginPath();g.moveTo(L[0][0],L[0][1]);
  for(let i=1;i<n;i++)g.lineTo(L[i][0],L[i][1]);
  for(let i=n-1;i>=0;i--)g.lineTo(Rr[i][0],Rr[i][1]);
  g.closePath();g.fill();
}
class Beast{
  constructor(o){
    Object.assign(this,{nt:9,ns:24,hueA:175,hueB:310,bodyHue:250,irisHue:185,rootR:30,eyeR:19,bodyR:40,reachEvery:3,segA:8,segB:12.5,s:.01},o||{});
    this.x=0;this.y=0;this.vx=0;this.vy=0;this.anger=0;this.flinch=0;this.lunge=0;this.blush=0;this.sleep=0;this.gulp=0;
    this.blinkT=-1e9;this.nextBlink=0;this.open=1;this.lx=0;this.ly=0;this.pupil=1;this.tents=[];
    for(let k=0;k<this.nt;k++){
      const pts=[];for(let i=0;i<this.ns;i++)pts.push({x:0,y:0});
      this.tents.push({a:k/this.nt*TAU+R()*.2,pts,ph:R()*TAU,hue:this.hueA+(this.nt>1?k/(this.nt-1):0)*(this.hueB-this.hueA),len:this.segA+R()*(this.segB-this.segA),reach:k%this.reachEvery===0});
    }
  }
  place(x,y){this.x=x;this.y=y;this.vx=this.vy=0;for(const T of this.tents)for(const p of T.pts){p.x=x;p.y=y;}}
  hueOf(h){h=h+(352-h)*this.anger;return h+(328-h)*this.blush*.85;}
  blinkStep(t){
    if(t>this.nextBlink){this.blinkT=t;this.nextBlink=t+2200+R()*4800;}
    const bp=(t-this.blinkT)/170;let o=bp<1?Math.abs(1-2*bp):1;
    if(this.flinch>.3)o=.08;
    this.open=Math.max(.04,o*(1-this.sleep*.97));
  }
  lookAt(px,py,has,dt){
    const L=Math.hypot(px-this.x,py-this.y)||1,o=Math.min(L*.05,1)*this.eyeR*.43*this.s;
    const tx=has?(px-this.x)/L*o:0,ty=has?(py-this.y)/L*o:0,k=Math.min(1,.18*dt);
    this.lx+=(tx-this.lx)*k;this.ly+=(ty-this.ly)*k;return L;
  }
  chain(P,seg,base){
    let pa=base,m=1.1;
    for(let i=1;i<P.length;i++){
      const a=P[i-1],b=P[i];let ang=Math.atan2(b.y-a.y,b.x-a.x);
      if(pa!==undefined){let d=ang-pa;d=Math.atan2(Math.sin(d),Math.cos(d));if(d>m)ang=pa+m;else if(d<-m)ang=pa-m;}
      b.x=a.x+Math.cos(ang)*seg;b.y=a.y+Math.sin(ang)*seg;pa=ang;m=.2;
    }
  }
  tentStep(dt,t,reach){
    const s=this.s,wig=1+this.anger*2.2,n=this.ns,sl=this.sleep,rr=this.rootR*s,push=.6*s*(1-sl*.75);
    for(const T of this.tents){
      const ra=T.a+Math.sin(t*.0006+T.ph)*.28,seg=Math.max(.4,T.len*s),ox=Math.cos(ra),oy=Math.sin(ra),P=T.pts;
      P[0].x=this.x+ox*rr;P[0].y=this.y+oy*rr;
      for(let i=1;i<n;i++){
        const p=P[i],f=i/n,w=Math.sin(t*.0026*wig+T.ph+i*.32)*(.3+f*.9)*s*wig*(1-sl*.8);
        p.x+=(ox*push-oy*w)*dt;p.y+=(oy*push+ox*w+(.15+sl*.9)*f*Math.max(.3,s))*dt;
        if(this.flinch>.02){p.x+=(P[0].x-p.x)*.12*this.flinch;p.y+=(P[0].y-p.y)*.12*this.flinch;}
      }
      for(let r=0;r<2;r++)for(let i=1;i<n-1;i++){const p=P[i];p.x+=((P[i-1].x+P[i+1].x)/2-p.x)*.35;p.y+=((P[i-1].y+P[i+1].y)/2-p.y)*.35;}
      this.chain(P,seg,ra);
      if(T.reach&&reach&&this.flinch<.2&&sl<.3){
        const dd=Math.hypot(reach.x-this.x,reach.y-this.y),tot=seg*(n-1);
        if(dd<tot*1.05&&dd>tot*.45){
          const tip=P[n-1];tip.x+=(reach.x-tip.x)*.22;tip.y+=(reach.y-tip.y)*.22;
          for(let i=n-2;i>=0;i--){const a=P[i+1],b=P[i],dx=b.x-a.x,dy=b.y-a.y,q=Math.hypot(dx,dy)||1;b.x=a.x+dx/q*seg;b.y=a.y+dy/q*seg;}
          P[0].x=this.x+ox*rr;P[0].y=this.y+oy*rr;this.chain(P,seg,ra);
        }
      }
    }
  }
  draw(g,t,ox,oy,alpha=1,comp='lighter'){
    const s=this.s;if(s<.02)return;
    const an=this.anger,X=this.x-ox,Y=this.y-oy;
    g.save();g.globalCompositeOperation=comp;g.globalAlpha=alpha;
    for(const T of this.tents){
      const h=this.hueOf(T.hue),P=T.pts;
      ribbon(g,P,ox,oy,s*3.4,`hsla(${h},95%,55%,.13)`);
      ribbon(g,P,ox,oy,s*1.6,`hsla(${h},95%,62%,.22)`);
      ribbon(g,P,ox,oy,s*.62,`hsla(${h},100%,${74+an*5}%,.75)`);
      const tp=P[P.length-1];
      g.fillStyle=`hsla(${h},100%,88%,${.6+.4*Math.sin(t*.006+T.ph)})`;g.beginPath();g.arc(tp.x-ox,tp.y-oy,2.2*Math.max(.5,s),0,TAU);g.fill();
    }
    const br=this.bodyR*s*(1+.06*Math.sin(t*.0021)+this.gulp*.3),h0=this.hueOf(this.bodyHue);
    const bg=g.createRadialGradient(X,Y,0,X,Y,br*2.2);
    bg.addColorStop(0,`hsla(${h0},90%,70%,.75)`);bg.addColorStop(.45,`hsla(${h0+20},90%,45%,.35)`);bg.addColorStop(1,`hsla(${h0},90%,40%,0)`);
    g.fillStyle=bg;g.beginPath();g.arc(X,Y,br*2.2,0,TAU);g.fill();
    g.restore();
    const er=this.eyeR*s,ir=er*.58,pr=ir*.46*this.pupil;
    g.save();g.globalAlpha=alpha;g.translate(X,Y);g.scale(1,Math.max(.06,this.open));
    const sc=g.createRadialGradient(-er*.25,-er*.3,er*.1,0,0,er);sc.addColorStop(0,'#ffffff');sc.addColorStop(1,an>.5?'#f3c9cf':'#c9d3f2');
    g.fillStyle=sc;g.beginPath();g.arc(0,0,er,0,TAU);g.fill();
    const ih=this.hueOf(this.irisHue),lx=this.lx,ly=this.ly;
    const ig=g.createRadialGradient(lx,ly,0,lx,ly,ir);ig.addColorStop(0,`hsl(${ih},100%,70%)`);ig.addColorStop(.7,`hsl(${ih+30},90%,38%)`);ig.addColorStop(1,`hsl(${ih+40},80%,14%)`);
    g.fillStyle=ig;g.beginPath();g.arc(lx,ly,ir,0,TAU);g.fill();
    g.fillStyle='#020104';g.beginPath();g.ellipse(lx,ly,pr*(1-an*.72),pr*(1+an*.35),0,0,TAU);g.fill();
    g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(lx-ir*.32,ly-ir*.38,ir*.16,0,TAU);g.fill();
    g.restore();
  }
  pack(){
    const a=[this.x,this.y,this.s,this.anger,this.flinch,this.open,this.lx,this.ly,this.pupil,this.sleep,this.blush];
    for(const T of this.tents)for(const p of T.pts)a.push(p.x,p.y);
    for(let i=0;i<a.length;i++)a[i]=Math.round(a[i]*100)/100;
    return a;
  }
  unpack(a){
    if(!a||a.length<11)return;
    [this.x,this.y,this.s,this.anger,this.flinch,this.open,this.lx,this.ly,this.pupil,this.sleep,this.blush]=a;
    let i=11;for(const T of this.tents)for(const p of T.pts){if(i+1>=a.length)return;p.x=a[i++];p.y=a[i++];}
  }
}
const cr=new Beast();
let you=null,giant=null;

/* the creature's brain — only runs in the window that hosts it */
function freshBrain(){return {pokes:0,raging:false,knocking:false,mission:null,annc:[],trapT:0,trapWhy:null,
  introDone:false,waitIntro:false,introAt:0,invIdx:0,diveArmed:false,diveDone:false,hoverMs:0,staredSaid:false,lastDiveHint:0,
  asleep:false,hidden:false,growFrom:0,reach:null,saidIdle:false,lastFast:0,lastLeave:0,lastTick:wall(),lastSqueeze:0};}
let B=freshBrain();

/* =================================================================
   other windows
   ================================================================= */
const me={id:Math.random().toString(36).slice(2,9),n:Date.now()+R()};
let bc=null;try{bc=new BroadcastChannel('gocrazy-vidro');}catch(e){bc=null;}
const peers=new Map(),rectsSeen=new Map();
let host=false,epoch=0,crSeenAt=0,remoteHid=false,crExists=false;
const crHidden=()=>host?B.hidden:remoteHid;
function post(m){if(!bc)return;m.id=me.id;m.n=me.n;try{bc.postMessage(m);}catch(e){}}
function send(m){if(peers.size)post(m);}
let lastFrame=0;
const alive=()=>perf()-lastFrame<300;
function hi(){post({k:'hi',rect:myRect(),stage,hidden:document.hidden,focus:document.hasFocus(),host,epoch,live:alive()});}
function electMe(){if(document.hidden||!alive())return false;for(const p of peers.values())if(!p.hidden&&p.live&&p.n<me.n)return false;return true;}
function packFull(){const b=Object.assign({},B,{reach:null,growFrom:0});return {pk:cr.pack(),vx:cr.vx,vy:cr.vy,B:b};}
function takeHost(st,ep){
  host=true;epoch=ep;crExists=true;crSeenAt=perf();
  if(st){cr.unpack(st.pk);cr.vx=st.vx||0;cr.vy=st.vy||0;Object.assign(B,st.B||{});}
  else{const keep={annc:B.annc};B=freshBrain();Object.assign(B,keep,{introDone:true,introAt:wall()-60000,invIdx:3});}
  B.growFrom=0;B.lastTick=wall();B.knocking=false;B.raging=false;B.reach=null;
  if(stage==='A'){B.trapT=wall();B.trapWhy=B.mission===me.id?'mission':'wander';}
  if(B.mission===me.id)B.mission=null;
  hi();
}
function giveTo(id){epoch++;post({k:'take',to:id,epoch,st:packFull()});host=false;crSeenAt=perf();}
function onMsg(m){
  if(!m||m.id===me.id)return;
  const w=wall();
  if(m.k!=='bye'){
    let p=peers.get(m.id);
    if(!p){p={id:m.id,n:m.n,since:w,rect:{x:0,y:0,w:0,h:0},stage:'A',hidden:true,focus:false,live:false};peers.set(m.id,p);}
    p.t=w;
  }
  switch(m.k){
    case 'hi':Object.assign(peers.get(m.id),{rect:m.rect,stage:m.stage,hidden:m.hidden,focus:m.focus,host:m.host,live:!!m.live});rectsSeen.set(m.id,m.rect);break;
    case 'bye':peers.delete(m.id);if(m.st&&!host&&electMe())takeHost(m.st,(m.epoch||epoch)+1);break;
    case 'cr':
      if(host){if(m.epoch>epoch||(m.epoch===epoch&&m.n<me.n))host=false;else break;}
      cr.unpack(m.pk);crSeenAt=perf();remoteHid=!!m.hid;epoch=Math.max(epoch,m.epoch);break;
    case 'take':if(m.to===me.id)takeHost(m.st,m.epoch);break;
    case 'ptr':Object.assign(gp,{sx:m.sx,sy:m.sy,has:true,last:w,speed:m.sp||0,src:m.id,down:!!m.dn});rec(m.sx,m.sy,w,0);break;
    case 'pd':Object.assign(gp,{sx:m.sx,sy:m.sy,has:true,last:w,src:m.id,down:true});rec(m.sx,m.sy,w,1);if(host&&stage==='C')handleClick(m.sx,m.sy);break;
    case 'pk':if(host&&stage==='C')poke();break;
    case 'say':say(m.text,m.o||{});break;
    case 'snd':if(ac&&!muted&&shouldPlay()&&SND[m.n])SND[m.n](...(m.a||[]));break;
    case 'fx':if(host)applyFx(m.fx);break;
  }
}
if(bc){bc.onmessage=e=>onMsg(e.data);setInterval(hi,300);}
addEventListener('pagehide',()=>{post({k:'bye',st:host?packFull():null,epoch});});

/* =================================================================
   sound
   ================================================================= */
let ac=null,master=null,bus=null,pan=null,drone=null,muted=false,nbuf=null,padN=null,lastGulp=0;
function audio(){
  if(!ac){try{
    ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
    bus=ac.createGain();if(ac.createStereoPanner){pan=ac.createStereoPanner();bus.connect(pan);pan.connect(master);}else bus.connect(master);
  }catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
function noise(){if(!nbuf){const n=ac.sampleRate*2;nbuf=ac.createBuffer(1,n,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=R()*2-1;}return nbuf;}
function burst(dur,type,freq,q,vol,delay=0,out){
  if(!ac||muted)return;const t=ac.currentTime+delay;
  const s=ac.createBufferSource();s.buffer=noise();const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(out||master);s.start(t,R()*1.5);s.stop(t+dur+.05);
}
function tone(freq,dur,vol,type='sine',delay=0,slide=0,out){
  if(!ac||muted)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(out||master);o.start(t);o.stop(t+dur+.05);
}
const SND={
